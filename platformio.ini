[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified @ ^0.2.8
    meganetaaan/M5Stack-Avatar @ ^0.10.0
    bblanchon/ArduinoJson @ ^7.4.1
monitor_speed = 115200
monitor_echo = yes
